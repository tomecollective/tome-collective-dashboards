name = "tome-lines"
main = "worker.js"
compatibility_date = "2026-09-01"

# KV for logged picks, closing lines, and cached ratings
[[kv_namespaces]]
binding = "LINES_KV"
id = "bc0817505d8d4909be4742d131b202de"   # npx wrangler kv namespace create LINES_KV

# Secrets (set with: npx wrangler secret put NAME)
#   BALLDONTLIE_API_KEY   same GOAT-tier key the Fast Break refresh worker uses
#   TOME_ADMIN_TOKEN      reuse the Fast Break admin token, or mint a new one

# Secrets for ingest (same values as tome-proxy):
#   BEEHIIV_API_KEY, BEEHIIV_PUBLICATION_ID
#
# Nightly market cache (06:10 UTC, after the last West Coast final) plus an hourly pass that logs
# any card printed in a preview published in the last 48 hours (no fetches unless a new preview exists).
[triggers]
# 06:45 UTC: one more pass after the late West Coast finals, so the D1 record copy is fresh for the
# 12:52am Central recap routine (each pass also refreshes the D1 copies below).
crons = ["10 6 * * *", "20 * * * *", "45 6 * * *"]

# D1 copy of the projection and record-summary responses for the scheduled Claude routines, which
# can't reach workers.dev but can query D1. Same database is bound to tome-tcg and tome-proxy.
# Created Nov 19, 2026; tables from dashboards/routine-data/migrations/0001_init.sql already exist.
# If you deploy via Quick Edit, add it in the dashboard: Settings > Bindings > D1 > ROUTINE_DB.
[[d1_databases]]
binding = "ROUTINE_DB"
database_name = "tome-routine-data"
database_id = "d38e62ae-d35e-4366-9fc1-bfbb4473bc92"

[vars]
# Tunables. Change here, redeploy. See README for what each does.
WNBA_HCA = "2.5"
NBA_HCA = "2.0"
NFL_HCA = "1.5"
WNBA_HALF_LIFE = "10"
# NBA retune, Nov 21 2026 (backtest-2026-nba.md): no recency decay, 20 games to full trust, 20-point cap per game.
NBA_HALF_LIFE = "0"
NBA_PRIOR_GAMES = "20"
NBA_MARGIN_CAP = "20"
NFL_HALF_LIFE = "4"
WNBA_SIDE_EDGE = "2.5"
WNBA_TOTAL_EDGE = "4"
NBA_SIDE_EDGE = "2.5"
NBA_TOTAL_EDGE = "4"
NFL_SIDE_EDGE = "1.5"
NFL_TOTAL_EDGE = "3"
PLAYOFF_GAME_WEIGHT = "1.5"
PLAYOFF_TOTAL_ADJ_WNBA = "-3"
PLAYOFF_TOTAL_ADJ_NBA = "-4"

