name = "tome-fastbreak" # the deployed service name (was "tome-fastbreak-dashboard" here, which would have created a second Worker)
main = "worker/index.js"
compatibility_date = "2026-08-08"

# This Worker is a thin public-facing read (and admin-write) proxy over the
# same KV namespace tome-fastbreak-refresh populates on a cron schedule. It
# never calls BALLDONTLIE directly. Create the namespace once with:
#   wrangler kv:namespace create FASTBREAK_KV
# then replace REPLACE_WITH_REAL_ID below with the id it prints -- use the
# SAME id here and in dashboards/fastbreak-refresh/wrangler.toml so both
# Workers read/write the same store.
[[kv_namespaces]]
binding = "FASTBREAK_KV"
id = "b492b464fa3c45fa854eae3bb90e5f88" # tome_fastbreak_kv

# Admin token gating writes to /api/fastbreak/objectives/day. Set with:
#   wrangler secret put FASTBREAK_ADMIN_TOKEN
#   wrangler secret put TOME_SUBSCRIBER_KEYS   # same value(s) as the refresh Worker
# Never commit the actual token values.

[[ratelimits]]
name = "PUBLIC_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Subscription-id auth: asks tome-proxy (over a service binding, never a public
# fetch) whether a Beehiiv subscription id unlocks this product. Requires the
# shared secret:  wrangler secret put TOME_INTERNAL_TOKEN  (same value on all four Workers)
[[services]]
binding = "AUTH"
service = "tome-proxy"
