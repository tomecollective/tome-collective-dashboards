name = "tome-set-value"
main = "worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "SET_VALUE_KV"
id = "f1bcbe15c77b4d9da98573cb0fb9d1d6"

# Free per-set checklists (card ticks keyed by Beehiiv subscription id). Create once:
#   npx wrangler d1 create tome-checklists      -> paste the database_id below
#   npx wrangler d1 execute tome-checklists --remote --file=./migrations/0001_checklists.sql
[[d1_databases]]
binding = "CHECKLISTS"
database_name = "tome-checklists"
database_id = "f8687190-8f8a-4872-bf70-c3ccd782244f"

[[services]]
binding = "AUTH"
service = "tome-proxy"
environment = "production"

[triggers]
# Daily at 10:30 UTC, all three games (one JustTCG /sets call each). Was a
# weekly per-game stagger until 2026-10-08; daily keeps the Saturday Tome Cards
# figures and each Spike Report's featured set on the same freshness as the index.
crons = ["30 10 * * *"]

[observability.logs]
enabled = true
