name = "tome-set-value"
main = "worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "SET_VALUE_KV"
id = "f1bcbe15c77b4d9da98573cb0fb9d1d6"

[[services]]
binding = "AUTH"
service = "tome-proxy"
environment = "production"

[triggers]
# Daily at 10:30 UTC, all three games (one JustTCG /sets call each). Was a
# weekly per-game stagger until 2026-10-08; daily keeps the Saturday Tome Cards
# figures and each Spike Report's featured set on the same freshness as the index.
crons = ["30 10 * * *"]

[observability.logs]
enabled = true
